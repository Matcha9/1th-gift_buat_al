<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Music Player 🎶</title>

<style>
body{
  margin:0;
  font-family:Arial, sans-serif;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#ffd6e8,#e8f0ff,#d6f0ff);
}

.container{
  width:350px;
  background:#fff;
  border-radius:26px;
  padding:20px;
  box-shadow:0 0 30px rgba(255,182,193,.8);
  border:3px solid #ffc0d9;
}

/* ===== PLAYER BOX ===== */
.player-box{
  background:#fff7fb;
  border-radius:22px;
  padding:16px;
  border:2px solid #ffd1e8;
}

/* ===== COVER DISC ===== */
.disk-wrapper{
  display:flex;
  justify-content:center;
  margin-bottom:12px;
}

.disk{
  width:180px;
  height:180px;
  border-radius:50%;
  object-fit:cover;
  box-shadow:0 8px 20px rgba(0,0,0,.25);
  animation:spin 6s linear infinite;
  animation-play-state:paused;
}

.playing{
  animation-play-state:running;
}

@keyframes spin{
  from{transform:rotate(0deg);}
  to{transform:rotate(360deg);}
}

/* ===== TITLE ===== */
.song-title{
  text-align:center;
  font-weight:bold;
  color:#444;
  margin:10px 0;
}

/* ===== PROGRESS ===== */
.progress-container{
  width:100%;
  height:6px;
  background:#ffd1e8;
  border-radius:10px;
  cursor:pointer;
}

.progress{
  height:100%;
  width:0%;
  background:#f78fb3;
  border-radius:10px;
}

/* ===== CONTROLS ===== */
.controls-center{
  display:flex;
  justify-content:space-around;
  align-items:center;
  margin-top:18px;
}

.controls-center button{
  border:none;
  background:#f3b6d8;
  padding:10px 16px;
  border-radius:50%;
  font-size:18px;
  cursor:pointer;
}

.play-btn{
  background:#ff7eb3;
  padding:14px 18px;
  font-size:22px;
}

/* ===== MENU ===== */
.menu{
  margin-top:16px;
}

.menu button{
  width:100%;
  padding:12px;
  border-radius:16px;
  border:none;
  background:#b5ccff;
  font-weight:bold;
  cursor:pointer;
}
</style>
</head>

<body>

<div class="container">

  <div class="player-box">
    <div class="disk-wrapper">
      <img id="cover" src="cover1.jpg" class="disk">
    </div>

    <div class="song-title" id="nowPlaying">
      Love Songs ❤️
    </div>

    <div class="progress-container" onclick="setProgress(event)">
      <div class="progress" id="progress"></div>
    </div>

    <div class="controls-center">
      <button onclick="prevSong()">⏮</button>
      <button class="play-btn" onclick="togglePlay()">▶️</button>
      <button onclick="nextSong()">⏭</button>
    </div>

    <audio id="audio"></audio>
  </div>

  <div class="menu">
    <button onclick="backMenu()">⬅ BACK TO MENU</button>
  </div>

</div>

<script>
// ================== PLAYLIST ==================
// NANTI KAMU BOLEH GANTI NAMA FILE DI SINI
const songs = [
  {
    title: "best_part",
    file: "music/best_part.mp3",
    cover: "bp.jpg"
  },
  {
    title: "sempurna",
    file: "music/sempurna.mp3",
    cover: "sem.jpg"
  },
  {
    title: "rewrite_the_stars",
    file: "music/rewrite_the_stars.mp3",
    cover: "rts.jpg"
  }
];

let index = 0;
const audio = document.getElementById("audio");
const cover = document.getElementById("cover");
const title = document.getElementById("nowPlaying");
const progress = document.getElementById("progress");
const playBtn = document.querySelector(".play-btn");

function loadSong(){
  audio.src = songs[index].file;
  cover.src = songs[index].cover;
  title.innerText = songs[index].title + " ❤️";
}

function togglePlay(){
  if(audio.paused){
    audio.play();
    cover.classList.add("playing");
    playBtn.innerText = "⏸";
  }else{
    audio.pause();
    cover.classList.remove("playing");
    playBtn.innerText = "▶️";
  }
}

function nextSong(){
  index = (index + 1) % songs.length;
  loadSong();
  audio.play();
  cover.classList.add("playing");
  playBtn.innerText = "⏸";
}

function prevSong(){
  index = (index - 1 + songs.length) % songs.length;
  loadSong();
  audio.play();
  cover.classList.add("playing");
  playBtn.innerText = "⏸";
}

audio.addEventListener("timeupdate", () => {
  if(audio.duration){
    const percent = (audio.currentTime / audio.duration) * 100;
    progress.style.width = percent + "%";
  }
});

audio.addEventListener("ended", nextSong);

function setProgress(e){
  const width = e.currentTarget.clientWidth;
  const clickX = e.offsetX;
  audio.currentTime = (clickX / width) * audio.duration;
}

function backMenu(){
  window.location.href = "gameboy.html";
}

loadSong();
</script>

</body>
</html>
