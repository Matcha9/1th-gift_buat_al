<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<title>Preparing Surprise 💙</title>

<style>
body{
  margin:0;
  height:100vh;
  display:flex;
  justify-content:center;
  align-items:center;
  background:linear-gradient(135deg,#8ec5ff,#ffffff,#ffd6e8);
  font-family:"Segoe UI",sans-serif;
  overflow:hidden;
}

/* hiasan background */
.bg-shape{
  position:absolute;
  width:200px;
  height:200px;
  background:rgba(255,255,255,0.35);
  border-radius:50%;
  filter:blur(20px);
  animation:float 6s infinite alternate;
}
.bg1{top:-40px;left:-40px;}
.bg2{bottom:-60px;right:-40px;animation-delay:2s;}

@keyframes float{
  from{transform:translateY(0)}
  to{transform:translateY(40px)}
}

/* kartu utama */
.card{
  background:#ffffffee;
  width:320px;
  height:430px;
  border-radius:26px;
  box-shadow:0 25px 50px rgba(0,0,0,.25);
  display:flex;
  flex-direction:column;
  justify-content:center;
  align-items:center;
  text-align:center;
  position:relative;
  animation:pop .8s ease;
}

@keyframes pop{
  from{transform:scale(.85);opacity:0}
  to{transform:scale(1);opacity:1}
}

h1{
  color:#2563eb;
  letter-spacing:4px;
  margin-bottom:20px;
}

/* icon love */
.heart{
  font-size:36px;
  animation:pulse 1.2s infinite;
  margin-bottom:10px;
}

@keyframes pulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.2)}
}

.loading-text{
  font-size:14px;
  color:#60a5fa;
  margin-bottom:14px;
  letter-spacing:1px;
}

/* progress */
.progress-box{
  width:210px;
  height:18px;
  border-radius:12px;
  background:#e5efff;
  overflow:hidden;
}

.progress-bar{
  width:0%;
  height:100%;
  background:linear-gradient(90deg,#60a5fa,#ff7eb3);
  animation:loading 4s forwards;
}

@keyframes loading{
  from{width:0%}
  to{width:100%}
}

/* teks bawah */
.note{
  position:absolute;
  bottom:20px;
  font-size:12px;
  color:#94a3b8;
}
</style>

<script>
setTimeout(()=>{
  window.location.href="gameboy.html";
},4200);
</script>
</head>

<body>

<div class="bg-shape bg1"></div>
<div class="bg-shape bg2"></div>

<div class="card">
  <div class="heart">💙</div>
  <h1>ANNIVERSARY<br>GIFT</h1>

  <div class="loading-text">
    PREPARING SURPRISE...
  </div>

  <div class="progress-box">
    <div class="progress-bar"></div>
  </div>

  <div class="note">just for you 💌</div>
</div>

</body>
</html>
