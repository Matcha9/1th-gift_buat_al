<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Riwayat Pesan 💌</title>

<style>
body{
  margin:0;
  font-family:Arial,sans-serif;
  background:linear-gradient(135deg,#ffd1e8,#fff);
  min-height:100vh;
  display:flex;
  justify-content:center;
  padding:20px 0;
}

.notebook{
  width:90%;
  max-width:460px;
  background:#fffafc;
  padding:24px 20px 20px;
  border-radius:26px;
  box-shadow:0 20px 40px rgba(0,0,0,.25);
  position:relative;
}

/* garis notebook */
.notebook::before{
  content:"";
  position:absolute;
  left:34px;
  top:0;
  bottom:0;
  width:3px;
  background:#ff9eb5;
}

/* tombol kembali pojok */
.back-btn{
  position:absolute;
  top:14px;
  left:14px;
  background:#9bbcff;
  border:none;
  border-radius:50%;
  width:36px;
  height:36px;
  font-size:18px;
  cursor:pointer;
}

h2{
  text-align:center;
  margin:0 0 10px;
  color:#ff6fa1;
}

/* grid */
.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:14px;
  margin-top:20px;
}

/* bubble */
.note{
  border-radius:16px;
  padding:12px;
  box-shadow:0 10px 20px rgba(0,0,0,.25);
  cursor:pointer;
  position:relative;
  min-height:110px;
  display:flex;
  flex-direction:column;
  justify-content:center;
}

.note::after{
  content:"";
  position:absolute;
  bottom:-10px;
  left:16px;
  width:60px;
  height:12px;
  background:#f1f1f1;
  border-radius:0 0 12px 12px;
}

.title{
  font-weight:bold;
  text-align:center;
  margin-bottom:6px;
}

.preview{
  font-size:13px;
  color:#555;
  text-align:center;
}

/* modal */
.modal{
  position:fixed;
  inset:0;
  background:rgba(0,0,0,.5);
  display:none;
  justify-content:center;
  align-items:center;
}

.modal-content{
  background:white;
  width:80%;
  max-width:380px;
  padding:20px;
  border-radius:20px;
  box-shadow:0 20px 40px rgba(0,0,0,.3);
}

.modal-content h3{
  margin-top:0;
  color:#ff6fa1;
  text-align:center;
}

.modal-content p{
  white-space:pre-wrap;
}

.modal-content button{
  width:100%;
  margin-top:10px;
  padding:10px;
  border:none;
  border-radius:14px;
  font-weight:bold;
}

.close{background:#9bbcff;}
.delete{background:#ff8d8d;}
</style>
</head>

<body>

<div class="notebook">
  <button class="back-btn" onclick="back()">⬅️</button>
  <h2>📓 Riwayat Pesan</h2>
  <div id="grid" class="grid"></div>
</div>

<!-- modal -->
<div class="modal" id="modal">
  <div class="modal-content">
    <h3 id="mJudul"></h3>
    <p id="mText"></p>
    <button class="delete" onclick="hapus()">🗑️ Hapus Pesan</button>
    <button class="close" onclick="tutup()">Tutup</button>
  </div>
</div>

<script>
const colors = [
  "#ffd6e8",
  "#fff2cc",
  "#dff5ea",
  "#e8e4ff",
  "#ffe8d6",
  "#e0f0ff"
];

const data = JSON.parse(localStorage.getItem("pesanPacar")) || [];
const grid = document.getElementById("grid");
let indexAktif = null;

data.forEach((item,i)=>{
  const div = document.createElement("div");
  div.className="note";
  div.style.background = colors[i % colors.length];
  div.innerHTML=`
    <div class="title">${item.judul}</div>
    <div class="preview">Klik untuk membaca 💌</div>
  `;
  div.onclick=()=>buka(i);
  grid.appendChild(div);
});

function buka(i){
  indexAktif = i;
  document.getElementById("mJudul").innerText = data[i].judul;
  document.getElementById("mText").innerText  = data[i].text;
  document.getElementById("modal").style.display="flex";
}

function tutup(){
  document.getElementById("modal").style.display="none";
}

function hapus(){
  if(confirm("Yakin mau hapus pesan ini?")){
    data.splice(indexAktif,1);
    localStorage.setItem("pesanPacar",JSON.stringify(data));
    location.reload();
  }
}

function back(){
  window.location.href="kesan_pesan.html";
}
</script>

</body>
</html>
